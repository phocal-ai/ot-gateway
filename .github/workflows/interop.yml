name: Interop

# Plenum against implementations that are not ours (scripts/interop.sh):
# Mosquitto and EMQX, the BACnet Stack demo server, and a pymodbus server.
# Our unit tests talk to our own test broker and simulators, so a spec
# misread the same way on both sides only shows up here.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - "packages/**"
      - "apps/**"
      - "test/interop/**"
      - "scripts/interop.sh"
      - ".github/workflows/interop.yml"
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Interop
        run: scripts/interop.sh
