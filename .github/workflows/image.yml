name: Image

# The gateway's container image (Dockerfile), for amd64 and arm64. Pull
# requests build both and smoke-test the amd64 one against the bench; a
# release tag (v*) publishes ghcr.io/phocal-ai/plenum-gateway.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "packages/**"
      - "apps/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/image.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default: only the publish job, which runs for release tags alone, may write packages.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build for amd64, and load it for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: plenum-gateway:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test against the bench
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          sed 's#"path": "./plenum-buffer.sqlite"#"path": "/var/lib/plenum/buffer.sqlite"#' examples/gateway.json > "$work/gateway.json"
          docker run --rm -v "$work/gateway.json:/etc/plenum/gateway.json:ro" plenum-gateway:smoke --check /etc/plenum/gateway.json
          # The bench (broker and simulated devices) from the image, the gateway in a second container.
          # The file, not its mktemp directory (mode 0700, another user's): the image runs as `node`.
          docker run -d --name bench --network host --entrypoint node \
            -v "$work/gateway.json:/work/gateway.json:ro" plenum-gateway:smoke apps/gateway/src/bench.ts /work/gateway.json
          sleep 3
          docker run -d --name gateway --network host -v "$work/gateway.json:/etc/plenum/gateway.json:ro" plenum-gateway:smoke
          for _ in $(seq 30); do
            if docker logs bench 2>&1 | grep -q "demo-site/b1/main-meter/active-power"; then break; fi
            sleep 1
          done
          docker logs bench 2>&1 | grep -E "demo-site/b1/(main-meter|ahu-2)/" | head -5
          docker logs bench 2>&1 | grep -q "demo-site/b1/main-meter/active-power"
          docker logs bench 2>&1 | grep -q "demo-site/b1/ahu-2/supply-air-temp"
          # The status page and its API, from the image's built web app.
          curl -sf http://127.0.0.1:8080/ | grep -q "<html"
          curl -sf http://127.0.0.1:8080/api/status | grep -q '"id":"main-meter"'

      - name: Container logs
        if: failure()
        run: |
          echo "--- bench"; docker logs bench 2>&1 | tail -40 || true
          echo "--- gateway"; docker logs gateway 2>&1 | tail -40 || true

      - name: Build for arm64 (Raspberry Pi 4 and 5), and load it for its smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: plenum-gateway:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The arm64 image under QEMU, bench and gateway in one container on Docker's default network,
      # as the arm64 soak runs them: values must reach the broker within four minutes of emulation.
      - name: Smoke test on arm64
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          sed 's#"path": "./plenum-buffer.sqlite"#"path": "/var/lib/plenum/buffer.sqlite"#' examples/gateway.json > "$work/gateway.json"
          docker run -d --name arm64 --platform linux/arm64 -v "$work/gateway.json:/work/gateway.json:ro" \
            --entrypoint bash plenum-gateway:arm64 -c '
              node apps/gateway/src/bench.ts /work/gateway.json >/tmp/bench.log 2>&1 &
              sleep 20
              node apps/gateway/src/main.ts /work/gateway.json >/tmp/gateway.log 2>&1 &
              sleep infinity'
          for _ in $(seq 240); do
            if docker exec arm64 grep -q "demo-site/b1/main-meter/active-power" /tmp/bench.log 2>/dev/null; then break; fi
            sleep 1
          done
          docker exec arm64 grep -E "demo-site/b1/(main-meter|ahu-2)/" /tmp/bench.log | head -5
          docker exec arm64 grep -q "demo-site/b1/main-meter/active-power" /tmp/bench.log

      - name: arm64 container logs
        if: failure()
        run: |
          echo "--- /etc/hosts"; docker exec arm64 cat /etc/hosts || true
          echo "--- bench"; docker exec arm64 head -40 /tmp/bench.log || true
          echo "--- gateway"; docker exec arm64 head -80 /tmp/gateway.log || true

  publish:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: PLENUM_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/phocal-ai/plenum-gateway:${{ github.ref_name }}
            ghcr.io/phocal-ai/plenum-gateway:latest
          cache-from: type=gha
