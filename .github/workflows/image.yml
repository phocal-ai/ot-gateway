name: Image

# The gateway's container image (Dockerfile), for amd64 and arm64. Pull
# requests build both and smoke-test them against the bench, with a build cache
# per architecture that only pull requests write. A pushed release tag (v*) on
# main publishes ghcr.io/phocal-ai/ot-gateway, built from the tagged source
# without the cache; only a plain vX.Y.Z also moves :latest.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "packages/**"
      - "apps/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/image.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default: only the publish job, which runs for release tags on main alone, may write packages.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build for amd64, and load it for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ot-gateway:smoke
          cache-from: type=gha,scope=image-amd64
          # Empty outside pull requests, which exports no cache.
          cache-to: ${{ github.event_name == 'pull_request' && 'type=gha,scope=image-amd64,mode=max' || '' }}

      - name: Smoke test against the bench
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          sed 's#"path": "./ot-gateway-buffer.sqlite"#"path": "/var/lib/ot-gateway/buffer.sqlite"#' examples/gateway.json > "$work/gateway.json"
          docker run --rm -v "$work/gateway.json:/etc/ot-gateway/gateway.json:ro" ot-gateway:smoke --check /etc/ot-gateway/gateway.json
          # The files the CLI finds next to the bundle: the device profiles and the version.
          docker run --rm ot-gateway:smoke profiles list --json | grep -q '"id": "eastron-sdm630"'
          docker run --rm ot-gateway:smoke --version
          # The installed command (packaging/ot-gateway): this image, the folder mounted, no terminal.
          (cd "$work" && OT_GATEWAY_IMAGE=ot-gateway OT_GATEWAY_TAG=smoke "$GITHUB_WORKSPACE/packaging/ot-gateway" check gateway.json | grep -q "config ok")
          # The bench (broker and simulated devices) from the image, the gateway in a second container.
          # The file, not its mktemp directory (mode 0700, another user's): the image runs as `node`.
          docker run -d --name bench --network host --entrypoint node \
            -v "$work/gateway.json:/work/gateway.json:ro" ot-gateway:smoke apps/gateway/src/bench.ts /work/gateway.json
          sleep 3
          docker run -d --name gateway --network host -v "$work/gateway.json:/etc/ot-gateway/gateway.json:ro" ot-gateway:smoke
          # Grep a copy of the log, not a pipe from `docker logs`: under pipefail, a grep -q or head that
          # stops reading early makes `docker logs` die of SIGPIPE, and the step fail with 141.
          for _ in $(seq 30); do
            docker logs bench > "$work/bench.log" 2>&1
            if grep -q "demo-site/building-a/main-meter/active-power" "$work/bench.log"; then break; fi
            sleep 1
          done
          docker logs bench > "$work/bench.log" 2>&1
          grep -m 5 -E "demo-site/building-a/(main-meter|ahu-2)/" "$work/bench.log"
          grep -q "demo-site/building-a/main-meter/active-power" "$work/bench.log"
          grep -q "demo-site/building-a/ahu-2/supply-air-temp" "$work/bench.log"
          # The status page and its API, from the image's built web app.
          curl -sf http://127.0.0.1:8080/ | grep -q "<html"
          curl -sf http://127.0.0.1:8080/api/status | grep -q '"id":"main-meter"'
          # `ot-gateway demo`, as the README has it: everything in one container, the page through a published port.
          docker rm -f bench gateway > /dev/null
          docker run -d --name demo -p 127.0.0.1:8080:8080 ot-gateway:smoke demo
          for _ in $(seq 30); do
            if curl -sf http://127.0.0.1:8080/api/status > "$work/demo.json" && grep -q '"status":"ok"' "$work/demo.json"; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' "$work/demo.json"
          curl -sf http://127.0.0.1:8080/ | grep -q "<html"

      - name: Container logs
        if: failure()
        run: |
          echo "--- bench"; docker logs bench 2>&1 | tail -40 || true
          echo "--- gateway"; docker logs gateway 2>&1 | tail -40 || true
          echo "--- demo"; docker logs demo 2>&1 | tail -40 || true

      - name: Build for arm64 (Raspberry Pi 4 and 5), and load it for its smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ot-gateway:arm64
          cache-from: type=gha,scope=image-arm64
          cache-to: ${{ github.event_name == 'pull_request' && 'type=gha,scope=image-arm64,mode=max' || '' }}

      # The arm64 image under QEMU, bench and gateway in one container on Docker's default network,
      # as the arm64 soak runs them: values must reach the broker within four minutes of emulation.
      - name: Smoke test on arm64
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          sed 's#"path": "./ot-gateway-buffer.sqlite"#"path": "/var/lib/ot-gateway/buffer.sqlite"#' examples/gateway.json > "$work/gateway.json"
          docker run -d --name arm64 --platform linux/arm64 -v "$work/gateway.json:/work/gateway.json:ro" \
            --entrypoint bash ot-gateway:arm64 -c '
              node apps/gateway/src/bench.ts /work/gateway.json >/tmp/bench.log 2>&1 &
              sleep 20
              node apps/gateway/src/main.mjs /work/gateway.json >/tmp/gateway.log 2>&1 &
              sleep infinity'
          for _ in $(seq 240); do
            if docker exec arm64 grep -q "demo-site/building-a/main-meter/active-power" /tmp/bench.log 2>/dev/null; then break; fi
            sleep 1
          done
          docker exec arm64 grep -m 5 -E "demo-site/building-a/(main-meter|ahu-2)/" /tmp/bench.log
          docker exec arm64 grep -q "demo-site/building-a/main-meter/active-power" /tmp/bench.log

      - name: arm64 container logs
        if: failure()
        run: |
          echo "--- /etc/hosts"; docker exec arm64 cat /etc/hosts || true
          echo "--- bench"; docker exec arm64 head -40 /tmp/bench.log || true
          echo "--- gateway"; docker exec arm64 head -80 /tmp/gateway.log || true

  publish:
    needs: image
    # A pushed tag only: a manual run on a tag ref does not publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Releases are tagged on main (CONTRIBUTING.md), so a tag anywhere else is not one.
      - name: Check that the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; tag releases on main only."
            exit 1
          fi

      - name: Image tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image=ghcr.io/phocal-ai/ot-gateway
          {
            echo "list<<EOF"
            echo "$image:$TAG"
            # A prerelease such as v0.7.0-rc.1 leaves :latest on the last release.
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "$image:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: OT_GATEWAY_VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.list }}
          # A release image is built from the tagged source alone, not from a shared build cache.
          no-cache: true
