name: Soak

# An accelerated soak (scripts/soak.sh): about a day of broker and device
# outages, full disks and COV renewals in half an hour, against the bench.
# Telemetry is off (no OTEL_* variables), so it costs nothing on Grafana Cloud.
#
# When it runs (CONTRIBUTING.md, "Soak"):
# - every night: the simulation only, with new seeds; it is cheap and finds the most
# - Sundays: the simulation, the 30-minute soak and the arm64 soak
# - a pull request into main (a release): the quick soak, `scripts/soak.sh quick`
# - by hand: any of them, on the branch it was started on
on:
  schedule:
    - cron: "23 3 * * 1-6"
    - cron: "23 3 * * 0"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      duration:
        description: "How long to run: 30m, 2h, ..."
        default: "30m"
      speed:
        description: "SOAK_SPEED: how many times faster than real time"
        default: "60"
      devices:
        description: "SOAK_DEVICES: copies of every device"
        default: "4"

permissions:
  contents: read

jobs:
  # The whole gateway on an in-memory network under virtual time (apps/gateway/test/Simulation.test.ts):
  # a simulated week per seed in a few minutes, with new seeds every night. A failure names its seed.
  # One job per seed, side by side, so a release pull request waits for the slowest seed, not for all five.
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Simulate
        run: |
          export SIM_SEEDS=$((GITHUB_RUN_NUMBER * 10 + ${{ matrix.seed }}))
          echo "seeds $SIM_SEEDS" | tee -a "$GITHUB_STEP_SUMMARY"
          pnpm --filter @ot-gateway/gateway sim
        env:
          SIM_HOURS: "168"

  # A Raspberry Pi stand-in until one is on the bench: the arm64 image under QEMU, held to two cores and 1 GB.
  # Emulation is several times slower than a Pi, so the speed is lower; what it shows is the ARM build and
  # the memory and CPU headroom under the same faults, not the SD card, heat or the real network.
  soak-arm64:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ot-gateway:arm64
      - name: Soak on arm64
        run: |
          mkdir -p "$RUNNER_TEMP/soak"
          docker run --rm --platform linux/arm64 --cpus 2 --memory 1g --user root \
            -v "$RUNNER_TEMP/soak:/soak" -e SOAK_DIR=/soak -e SOAK_SPEED=20 -e SOAK_DEVICES=2 \
            --entrypoint bash ot-gateway:arm64 scripts/soak.sh 40m
      - name: Summary
        if: always()
        run: |
          {
            echo '### arm64 under QEMU, 2 cores, 1 GB'
            echo '```'
            cat "$RUNNER_TEMP/soak/events.log" "$RUNNER_TEMP/soak/summary.txt" 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: failure()
        # In the job log too, not only the artifact: the gateway's, the broker's and the devices' last lines.
        run: |
          echo "--- gateway.log, first 60 lines"
          head -n 60 "$RUNNER_TEMP/soak/gateway.log" 2>/dev/null || echo "(none)"
          echo "--- gateway.log, MQTT lines"
          grep -i -A4 "mqtt" "$RUNNER_TEMP/soak/gateway.log" 2>/dev/null | head -n 80 || true
          for name in gateway broker devices; do
            echo "--- $name.log, last 80 lines"
            tail -n 80 "$RUNNER_TEMP/soak/$name.log" 2>/dev/null || echo "(none)"
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: soak-arm64
          path: |
            ${{ runner.temp }}/soak/*.log
            ${{ runner.temp }}/soak/*.csv
            ${{ runner.temp }}/soak/*.txt
          retention-days: 7

  soak:
    if: github.event_name != 'schedule' || github.event.schedule == '23 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          # The weekly run soaks dev; a pull request soaks its merge; a manual run soaks the branch it was started on.
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Soak
        # A release pull request runs the quick preset; the other runs take their settings from below.
        run: scripts/soak.sh "${{ github.event_name == 'pull_request' && 'quick' || '$DURATION' }}"
        env:
          DURATION: ${{ inputs.duration || '30m' }}
          SOAK_SPEED: ${{ inputs.speed || '60' }}
          SOAK_DEVICES: ${{ inputs.devices || '4' }}
          SOAK_DISK_FAULT: "1"
          SOAK_DIR: ${{ runner.temp }}/soak
      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/soak/events.log" "$RUNNER_TEMP/soak/summary.txt" 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: failure()
        # In the job log too, not only the artifact: the gateway's, the broker's and the devices' last lines.
        run: |
          for name in gateway broker devices; do
            echo "--- $name.log, last 80 lines"
            tail -n 80 "$RUNNER_TEMP/soak/$name.log" 2>/dev/null || echo "(none)"
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: soak
          path: |
            ${{ runner.temp }}/soak/*.log
            ${{ runner.temp }}/soak/*.csv
            ${{ runner.temp }}/soak/*.txt
            ${{ runner.temp }}/soak/gateway.json
          retention-days: 7
