name: Binary

# The `ot-gateway` binary (scripts/build-binary.sh) for linux-x64, linux-arm64
# and darwin-arm64. Pull requests build all three and smoke-test each one
# through packaging/get.sh: linux-x64 and darwin-arm64 natively, linux-arm64
# under QEMU. A pushed release tag (v*) on main also attaches them, with
# SHA256SUMS, to that tag's GitHub release, which is where get.sh downloads from.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - "packages/**"
      - "apps/gateway/**"
      - "apps/web/**"
      - "examples/gateway.json"
      - "pnpm-lock.yaml"
      - "scripts/build-binary.sh"
      - "packaging/get.sh"
      - ".github/workflows/binary.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default: only the release job, which runs for release tags on main alone, may write.
permissions:
  contents: read

env:
  # `node --build-sea` with a virtual file system needs Node 26.9 or newer; the binaries carry this Node.
  NODE_VERSION: "26"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A strip for arm64 code: Node's Linux builds carry about 30 MB of symbols.
      - run: sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Build linux-x64 and linux-arm64
        env:
          OT_GATEWAY_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: scripts/build-binary.sh linux-x64 linux-arm64

      - name: Smoke test linux-x64
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          (cd dist/binary && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          OT_GATEWAY_DOWNLOAD_URL=http://127.0.0.1:8765 OT_GATEWAY_INSTALL_DIR="$work/bin" sh packaging/get.sh
          "$work/bin/ot-gateway" --version
          "$work/bin/ot-gateway" check examples/gateway.json
          # The demo from the binary: example config, simulated devices, broker and status page, all from inside it.
          (cd "$work" && "$work/bin/ot-gateway" demo >"$work/demo.log" 2>&1 &)
          for _ in $(seq 30); do
            if curl -sf http://127.0.0.1:8080/api/status >"$work/demo.json" && grep -q '"status":"ok"' "$work/demo.json"; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' "$work/demo.json" || { tail -40 "$work/demo.log"; exit 1; }
          curl -sf http://127.0.0.1:8080/ | grep -q "<html"

      - uses: docker/setup-qemu-action@v4
      - name: Smoke test linux-arm64 under QEMU
        run: |
          set -euo pipefail
          (cd dist/binary && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          docker run --rm --platform linux/arm64 --network host \
            -v "$PWD/packaging/get.sh:/get.sh:ro" -v "$PWD/examples:/examples:ro" node:24-bookworm sh -c '
              set -eu
              OT_GATEWAY_DOWNLOAD_URL=http://127.0.0.1:8765 sh /get.sh
              ot-gateway --version
              ot-gateway check /examples/gateway.json'

      - uses: actions/upload-artifact@v7
        with:
          name: binary-linux
          path: dist/binary/ot-gateway-*.tar.gz
          retention-days: 7

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build darwin-arm64
        env:
          OT_GATEWAY_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: scripts/build-binary.sh darwin-arm64

      - name: Smoke test darwin-arm64
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          (cd dist/binary && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          OT_GATEWAY_DOWNLOAD_URL=http://127.0.0.1:8765 OT_GATEWAY_INSTALL_DIR="$work/bin" sh packaging/get.sh
          "$work/bin/ot-gateway" --version
          "$work/bin/ot-gateway" check examples/gateway.json
          (cd "$work" && "$work/bin/ot-gateway" demo >"$work/demo.log" 2>&1 &)
          for _ in $(seq 30); do
            if curl -sf http://127.0.0.1:8080/api/status >"$work/demo.json" && grep -q '"status":"ok"' "$work/demo.json"; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' "$work/demo.json" || { tail -40 "$work/demo.log"; exit 1; }
          curl -sf http://127.0.0.1:8080/ | grep -q "<html"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-macos
          path: dist/binary/ot-gateway-*.tar.gz
          retention-days: 7

  release:
    needs: [linux, macos]
    # A pushed tag only: a manual run on a tag ref does not publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Releases are tagged on main (CONTRIBUTING.md), so a tag anywhere else is not one.
      - name: Check that the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; tag releases on main only."
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum ot-gateway-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ot-gateway-*.tar.gz SHA256SUMS --clobber
          else
            # A prerelease such as v0.8.0-rc.1 is marked as one, so releases/latest (get.sh's default) skips it.
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" ot-gateway-*.tar.gz SHA256SUMS --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"
          fi
