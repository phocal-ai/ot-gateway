name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Turborepo remote cache on Vercel (team wimluks-projects). Without the secret, as in a fork's
      # pull request, turbo runs everything with no remote cache. Pull requests only read it; pushes to
      # dev and main write it, so a branch cannot seed a result that other runs trust.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: wimluks-projects
      TURBO_CACHE: ${{ github.event_name == 'pull_request' && 'local:rw,remote:r' || 'local:rw,remote:rw' }}
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: scripts/test-health-gh.sh
      - name: Build the status page
        run: pnpm --filter @ot-gateway/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
