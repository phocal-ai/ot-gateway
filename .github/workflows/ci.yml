name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # The Deps and Triage routines start CI on the branches they push: a pull request
  # opened with GITHUB_TOKEN starts no workflows on its own.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the run before it: only the last commit's result is read. Every other
# run (a push to dev or main, a tag, a manual start) is in a group of its own and runs to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Turborepo remote cache on Vercel (team wimluks-projects), for pushes to dev and main only. A Vercel
      # token cannot be limited to the cache, and a pull request runs its own code, which could read it.
      # So pull requests, including the bots' (deps.yml, triage.yml), build without the remote cache.
      TURBO_TOKEN: ${{ github.event_name == 'push' && secrets.TURBO_TOKEN || '' }}
      TURBO_TEAM: wimluks-projects
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: scripts/test-health-gh.sh
      - run: scripts/test-routines.sh
      - name: Build the status page
        run: pnpm --filter @ot-gateway/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
