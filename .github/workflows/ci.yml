name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Turborepo remote cache on Vercel (team wimluks-projects), for pushes to dev and main only. A Vercel
      # token cannot be limited to the cache, and a pull request runs its own code, which could read it.
      # So pull requests, including the bots' (deps.yml, triage.yml), build without the remote cache.
      TURBO_TOKEN: ${{ github.event_name == 'push' && secrets.TURBO_TOKEN || '' }}
      TURBO_TEAM: wimluks-projects
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: scripts/test-health-gh.sh
      - name: Build the status page
        run: pnpm --filter @ot-gateway/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
