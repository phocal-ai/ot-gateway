name: Health

# Daily unattended health check: Claude Code runs the budget and gateway
# sections of .claude/skills/health/SKILL.md against Grafana Cloud and tracks
# findings as `health` issues. The prompt is .github/prompts/health.md. The
# agent reaches GitHub only through .github/scripts/health-gh.sh, which keeps it
# to `health` issues, and runs no other shell command (.github/scripts/
# health-bash-guard.sh). Tests for both: scripts/test-health-gh.sh.
#
# Secrets (the job skips with a warning until all three exist):
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token`
#   GRAFANA_MCP_URL          the Grafana stack URL
#   GRAFANA_MCP_READ_TOKEN   a Viewer service-account token, used only here
#
# Cost: public repo, so Actions minutes are free; about 3 min a day. Grafana
# query volume is a few MB of Loki and Prometheus reads per run. Nothing here
# exports telemetry.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_VERSION: 2.1.316
      CLAUDE_MODEL: claude-sonnet-5-5
      MCP_GRAFANA_VERSION: 2.0.2
      MCP_GRAFANA_SHA256: 624e997b78bcadf236f82f8086827890ba77b6dfdc6fd6446f7c48dfd9e586f0
    steps:
      - name: Check secrets
        id: secrets
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GRAFANA_MCP_URL: ${{ secrets.GRAFANA_MCP_URL }}
          GRAFANA_MCP_READ_TOKEN: ${{ secrets.GRAFANA_MCP_READ_TOKEN }}
        run: |
          missing=""
          for name in CLAUDE_CODE_OAUTH_TOKEN GRAFANA_MCP_URL GRAFANA_MCP_READ_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Health check skipped, missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          # The job reaches GitHub only through gh and GH_TOKEN, so git needs no stored credentials.
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc

      - name: Install mcp-grafana
        if: steps.secrets.outputs.ready == 'true'
        run: |
          archive="$RUNNER_TEMP/mcp-grafana.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/grafana/mcp-grafana/releases/download/v${MCP_GRAFANA_VERSION}/mcp-grafana_Linux_x86_64.tar.gz"
          echo "${MCP_GRAFANA_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mcp-grafana"
          tar -xzf "$archive" -C "$RUNNER_TEMP/mcp-grafana" mcp-grafana
          jq -n --arg command "$RUNNER_TEMP/mcp-grafana/mcp-grafana" '{
            mcpServers: { grafana: {
              command: $command,
              args: ["--disable-write", "--enabled-tools=datasource,prometheus,loki,tempo", "--usage-stats=disabled"],
              env: { GRAFANA_URL: "${GRAFANA_MCP_URL}", GRAFANA_SERVICE_ACCOUNT_TOKEN: "${GRAFANA_MCP_READ_TOKEN}" }
            } }
          }' > "$RUNNER_TEMP/mcp.json"

      - name: Run health check
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GRAFANA_MCP_URL: ${{ secrets.GRAFANA_MCP_URL }}
          GRAFANA_MCP_READ_TOKEN: ${{ secrets.GRAFANA_MCP_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Without pipefail, tee hides a Claude failure (bad token, CLI error) and the job passes.
          set -o pipefail
          # What the agent can reach:
          # - Built-in tools: Read, Grep and Glob for the checkout, and Bash for one command,
          #   .github/scripts/health-gh.sh (health-labelled issues only, only the bot's text).
          #   Naming Grep and Glob brings them back; on Linux they are not in the default set.
          # - blockReadsOutsideWorkingDirectories makes the file tools refuse paths outside the
          #   checkout. health-bash-guard.sh (a PreToolUse hook) denies every other shell
          #   command, including the read-only ones Claude Code runs without asking.
          # - The denies cover the checkout's .git and, as a second layer, a few system paths.
          #   In a rule, `//` starts an absolute path and `~/` the home directory.
          # - dontAsk denies whatever would need approval.
          tools="Read,Grep,Glob,Bash"
          allowed=(
            "Read(./**)" Grep Glob
            mcp__grafana__query_prometheus mcp__grafana__query_loki_logs mcp__grafana__query_loki_stats
            mcp__grafana__query_tempo_metrics mcp__grafana__search_tempo_traces
            mcp__grafana__list_prometheus_metric_names mcp__grafana__list_prometheus_label_values
            "Bash(.github/scripts/health-gh.sh:*)"
          )
          denied=(
            "Read(./.git/**)" "Read(//proc/**)" "Read(//sys/**)" "Read(/$RUNNER_TEMP/**)" "Read(~/.config/**)"
          )
          settings=$(jq -cn '{
            permissions: { blockReadsOutsideWorkingDirectories: true },
            hooks: { PreToolUse: [ { matcher: "Bash", hooks: [
              { type: "command", command: "\"$CLAUDE_PROJECT_DIR\"/.github/scripts/health-bash-guard.sh", timeout: 10 }
            ] } ] }
          }')
          npx -y "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" \
            -p "$(cat .github/prompts/health.md)" \
            --model "$CLAUDE_MODEL" \
            --mcp-config "$RUNNER_TEMP/mcp.json" --strict-mcp-config \
            --settings "$settings" \
            --permission-mode dontAsk \
            --tools "$tools" \
            --allowedTools "${allowed[@]}" \
            --disallowedTools "${denied[@]}" \
            --output-format text < /dev/null | tee "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q '^OUTCOME: ' "$RUNNER_TEMP/report.md"; then
            echo "::error::Health check ended without an OUTCOME line; see the report."
            exit 1
          fi
          if grep -q '^OUTCOME: infra-gap' "$RUNNER_TEMP/report.md"; then
            echo "::error::Health check could not reach Grafana or GitHub; see the report."
            exit 1
          fi
